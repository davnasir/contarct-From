<div class="contact-form-box">
    <h2>Get in Touch</h2>
    <p class="form-description">
        Fill out the quick form below and our partnerships lead will reach out shortly.
    </p>

    <form>
        <div class="form-row">

            <div class="form-group">
                <label for="name">YOUR NAME</label>
                <input type="text" id="name" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" placeholder="john@company.com">
            </div>

        </div>

        <div class="form-group">
            <label for="subject">SUBJECT</label>
            <input type="text" id="subject" placeholder="How can we assist you?">
        </div>

        <div class="form-group">
            <label for="message">MESSAGE</label>
            <textarea id="message"
                placeholder="Briefly describe your goals, technology hurdles, or project details..."></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>
</div>

<style>
    .contact-form-box {
        width: 100%;
        max-width: 860px;
        margin: 30px auto;
        padding: 40px;
        box-sizing: border-box;

        background: linear-gradient(135deg,
                #111a2d,
                #121a35);

        border: 1px solid #25314a;
        border-radius: 20px;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .contact-form-box h2 {
        margin: 0 0 32px;
        font-size: 27px;
        font-weight: 700;
        color: #ffffff;
    }

    .form-description {
        margin: 0 0 36px;
        color: #9eb0cf;
        font-size: 16px;
        line-height: 1.6;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        margin-bottom: 29px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #9db0d0;
        font-size: 14px;
        font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        border: none;
        outline: none;

        background: #202c41;
        color: #ffffff;

        border-radius: 15px;
        padding: 17px 21px;

        font-size: 15px;
        font-family: inherit;

        transition: 0.3s ease;
    }

    .form-group input {
        height: 52px;
    }

    .form-group textarea {
        min-height: 112px;
        resize: vertical;
        line-height: 1.5;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: #91a2c1;
        opacity: 1;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        background: #26334b;
        box-shadow: 0 0 0 2px rgba(74, 99, 255, 0.35);
    }

    .contact-form-box button {
        width: 100%;
        height: 65px;
        border: none;
        border-radius: 15px;

        background: linear-gradient(90deg,
                #2864ed,
                #7742e9);

        color: #ffffff;
        font-size: 17px;
        font-weight: 700;

        cursor: pointer;
        transition: all 0.3s ease;

        box-shadow: 0 10px 25px rgba(39, 91, 230, 0.18);
    }

    .contact-form-box button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(72, 76, 235, 0.30);
    }

    .contact-form-box button:active {
        transform: translateY(0);
    }

    /* Mobile Responsive */
    @media (max-width: 700px) {

        .contact-form-box {
            padding: 28px 20px;
            border-radius: 16px;
        }

        .contact-form-box h2 {
            font-size: 24px;
            margin-bottom: 22px;
        }

        .form-description {
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .form-group {
            margin-bottom: 23px;
        }

        .contact-form-box button {
            height: 58px;
        }
    }
</style>
